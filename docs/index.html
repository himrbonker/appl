<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Appl</title>
		<link rel="stylesheet" href="/styles.css" />
		<meta name="robots" content="noindex" />
	</head>

	<body>
		<div class="shell">
			<nav class="sidebar" aria-label="App rail">
				<div class="sidebar__item">
					<button
						id="sidebar-home"
						class="sidebar__btn sidebar__btn--active"
						type="button"
						aria-label="Home"
						title="Home"
					>
						<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true">
							<path
								d="M4 11.5 12 4l8 7.5"
								fill="none"
								stroke="currentColor"
								stroke-width="1.8"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
							<path
								d="M6 10v9a1 1 0 0 0 1 1h3v-5a2 2 0 0 1 4 0v5h3a1 1 0 0 0 1-1v-9"
								fill="none"
								stroke="currentColor"
								stroke-width="1.8"
								stroke-linecap="round"
								stroke-linejoin="round"
							/>
						</svg>
					</button>
				</div>

				<div id="sidebar-quicklaunch" class="sidebar__group"></div>

				<div class="sidebar__divider" aria-hidden="true"></div>

				<div class="sidebar__item">
					<button
						id="sidebar-add-shortcut"
						class="sidebar__btn"
						type="button"
						aria-label="Add shortcut"
						title="Add shortcut"
					>
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
							<path
								d="M12 5v14M5 12h14"
								fill="none"
								stroke="currentColor"
								stroke-width="1.8"
								stroke-linecap="round"
							/>
						</svg>
					</button>
				</div>

				<div class="sidebar__item">
					<button
						id="sidebar-customize"
						class="sidebar__btn"
						type="button"
						aria-label="Customize background"
						title="Customize background"
						aria-expanded="false"
					>
						<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
							<path
								d="M12 3a9 9 0 1 0 0 18c1.1 0 1.7-.6 1.7-1.4 0-.4-.15-.75-.4-1.05-.25-.3-.4-.65-.4-1.05 0-.8.6-1.4 1.4-1.4H16a4 4 0 0 0 4-4c0-5-3.6-9-8-9Z"
								fill="none"
								stroke="currentColor"
								stroke-width="1.6"
								stroke-linejoin="round"
							/>
							<circle cx="7.5" cy="10.5" r="1.15" fill="currentColor" />
							<circle cx="10.5" cy="7" r="1.15" fill="currentColor" />
							<circle cx="15" cy="7.5" r="1.15" fill="currentColor" />
							<circle cx="17" cy="11.5" r="1.15" fill="currentColor" />
						</svg>
					</button>

					<div id="bg-panel" class="bg-panel" hidden>
						<div class="bg-panel__row">
							<span class="bg-panel__title">Background</span>
							<button
								id="bg-panel-close"
								class="bg-panel__close"
								type="button"
								aria-label="Close"
							>
								<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true">
									<path
										d="M6 6l12 12M18 6 6 18"
										fill="none"
										stroke="currentColor"
										stroke-width="2"
										stroke-linecap="round"
									/>
								</svg>
							</button>
						</div>

						<div id="bg-swatches" class="bg-swatches"></div>

						<label class="bg-panel__field">
							<span>Custom color</span>
							<input type="color" id="bg-color-input" value="#0e1f16" />
						</label>

						<label class="bg-panel__field bg-panel__field--file">
							<span>Upload image</span>
							<input type="file" id="bg-upload-input" accept="image/*" />
						</label>

						<button id="bg-reset-btn" class="bg-panel__reset" type="button">
							Reset to default
						</button>
					</div>
				</div>

				<div class="sidebar__spacer"></div>
			</nav>

			<div class="browser">
				<div class="titlebar">
					<div id="tabstrip" class="tabstrip" role="tablist" aria-label="Open tabs"></div>
					<button id="new-tab" class="new-tab-btn" type="button" aria-label="New tab" title="New tab">
						<svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
							<path
								d="M12 5v14M5 12h14"
								fill="none"
								stroke="currentColor"
								stroke-width="2"
								stroke-linecap="round"
							/>
						</svg>
					</button>
				</div>

				<div class="toolbar">
					<div class="nav-group">
						<button id="back" class="nav-btn" type="button" aria-label="Back" title="Back">
							<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
								<path
									d="M15 5 8 12l7 7"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
						<button id="forward" class="nav-btn" type="button" aria-label="Forward" title="Forward">
							<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
								<path
									d="m9 5 7 7-7 7"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
						<button id="reload" class="nav-btn" type="button" aria-label="Reload" title="Reload">
							<svg id="reload-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
								<path
									d="M20 11a8 8 0 1 0-2.34 5.66M20 5v6h-6"
									fill="none"
									stroke="currentColor"
									stroke-width="2"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
					</div>

					<form id="omnibox" class="omnibox" role="search">
						<span class="omnibox__icon" aria-hidden="true">
							<svg viewBox="0 0 24 24" width="14" height="14">
								<path
									d="M12 17a2 2 0 0 0 2-2 2 2 0 0 0-4 0 2 2 0 0 0 2 2Z"
									fill="currentColor"
								/>
								<path
									d="M7 10V7a5 5 0 0 1 10 0v3"
									fill="none"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linecap="round"
								/>
								<rect
									x="5"
									y="10"
									width="14"
									height="10"
									rx="2.2"
									fill="none"
									stroke="currentColor"
									stroke-width="1.6"
								/>
							</svg>
						</span>
						<input
							id="address"
							type="text"
							name="address"
							placeholder="Search or enter address"
							autocomplete="off"
							autocapitalize="off"
							spellcheck="false"
							enterkeyhint="go"
							aria-label="Address"
						/>
					</form>

					<div class="toolbar__right">
						<div class="media-pill" aria-hidden="true">
							<svg viewBox="0 0 24 24" width="13" height="13">
								<path
									d="M9 18V5l11-2v13"
									fill="none"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
								<circle cx="6" cy="18" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
								<circle cx="17" cy="16" r="3" fill="none" stroke="currentColor" stroke-width="1.6" />
							</svg>
							<span>Nothing playing</span>
							<span class="media-pill__transport">
								<svg viewBox="0 0 24 24" width="11" height="11"><path d="M17 5 8 12l9 7z" fill="currentColor" /></svg>
								<svg viewBox="0 0 24 24" width="11" height="11"><path d="M9 6v12l9-6z" fill="currentColor" /></svg>
								<svg viewBox="0 0 24 24" width="11" height="11"><path d="M7 5 16 12l-9 7z" fill="currentColor" /></svg>
							</span>
						</div>

						<span class="toolbar__divider" aria-hidden="true"></span>

						<div id="progress-ring" class="progress-ring" hidden aria-hidden="true"></div>

						<button
							id="split-btn"
							class="nav-btn"
							type="button"
							aria-label="Split view"
							title="Split view"
							aria-pressed="false"
						>
							<svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
								<rect x="3.5" y="4.5" width="17" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.6" />
								<path d="M12 4.5v15" fill="none" stroke="currentColor" stroke-width="1.6" />
							</svg>
						</button>

						<button
							id="star-btn"
							class="nav-btn"
							type="button"
							aria-label="Add page as shortcut"
							title="Add page as shortcut"
							disabled
						>
							<svg id="star-icon" viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
								<path
									d="m12 4 2.4 5.1 5.6.6-4.2 3.8 1.2 5.5L12 16.2 6.9 19l1.2-5.5-4.2-3.8 5.6-.6Z"
									fill="none"
									stroke="currentColor"
									stroke-width="1.7"
									stroke-linejoin="round"
								/>
							</svg>
						</button>

						<button id="share-btn" class="nav-btn" type="button" aria-label="Copy link" title="Copy link" disabled>
							<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
								<circle cx="18" cy="5" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6" />
								<circle cx="6" cy="12" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6" />
								<circle cx="18" cy="19" r="2.3" fill="none" stroke="currentColor" stroke-width="1.6" />
								<path
									d="m8.1 10.8 7.8-4.1M8.1 13.2l7.8 4.1"
									fill="none"
									stroke="currentColor"
									stroke-width="1.6"
									stroke-linecap="round"
								/>
							</svg>
						</button>

						<button id="fullscreen-btn" class="nav-btn" type="button" aria-label="Toggle fullscreen" title="Toggle fullscreen">
							<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true">
								<path
									d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4"
									fill="none"
									stroke="currentColor"
									stroke-width="1.7"
									stroke-linecap="round"
									stroke-linejoin="round"
								/>
							</svg>
						</button>
					</div>
				</div>

				<div id="progress" class="progress-bar" hidden aria-hidden="true">
					<div class="progress-bar__fill"></div>
				</div>

				<p id="status" class="status" role="status" hidden></p>

				<main id="frames" class="frames">
					<div id="newtab" class="newtab">
						<div class="newtab__content">
							<h1 class="wordmark">Appl</h1>
							<p class="tagline">green light, always.</p>

							<form id="hero-search" class="hero-search" role="search">
								<span class="hero-search__icon" aria-hidden="true">
									<svg viewBox="0 0 24 24" width="16" height="16">
										<circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8" />
										<path d="m20 20-4.35-4.35" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
									</svg>
								</span>
								<input
									id="hero-search-input"
									type="text"
									placeholder="Search for anything!"
									autocomplete="off"
									autocapitalize="off"
									spellcheck="false"
									enterkeyhint="go"
									aria-label="Search for anything"
								/>
							</form>

							<div id="quicklaunch" class="quicklaunch"></div>

							<div id="shortcuts-panel" class="shortcuts-panel" hidden>
								<div class="shortcuts-panel__label">Your shortcuts</div>
								<div id="shortcuts" class="newtab__shortcuts"></div>
							</div>
						</div>
					</div>
				</main>

				<dialog id="shortcut-dialog" class="shortcut-dialog">
					<form id="shortcut-form" method="dialog">
						<h3 id="shortcut-dialog-title">Add shortcut</h3>

						<div class="shortcut-dialog__icon-row">
							<span id="shortcut-icon-preview" class="shortcut-icon-preview">?</span>
							<div class="shortcut-dialog__icon-controls">
								<label class="shortcut-dialog__icon-upload">
									Upload image
									<input id="shortcut-icon-input" type="file" accept="image/*" hidden />
								</label>
								<button id="shortcut-icon-clear" type="button" class="shortcut-dialog__icon-clear" hidden>
									Use site icon instead
								</button>
							</div>
						</div>

						<label class="shortcut-dialog__field">
							<span>Name</span>
							<input id="shortcut-name" type="text" autocomplete="off" placeholder="e.g. Wikipedia" />
						</label>
						<label class="shortcut-dialog__field">
							<span>URL</span>
							<input id="shortcut-url" type="text" autocomplete="off" placeholder="example.com" required />
						</label>
						<div class="shortcut-dialog__actions">
							<button id="shortcut-cancel" class="btn btn--secondary" type="button">Cancel</button>
							<button class="btn btn--primary" type="submit">Save</button>
						</div>
					</form>
				</dialog>
			</div>
		</div>

		<script>
			// Leave this empty for a normal single-server setup (frontend + backend
			// together). Fill it in with your backend's public URL (no trailing
			// slash) when the frontend is hosted separately, e.g. on GitHub Pages,
			// so it can reach the proxy engine and /wisp/ socket over there instead.
			window.PROXY_BACKEND = "https://thee-blacks-breathing-suites.trycloudflare.com";
		</script>
		<script type="module" src="/js/app.js"></script>
	</body>
</html>
